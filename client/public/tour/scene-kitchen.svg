<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="0.5" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="tiles" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#E8F6FD"/>
      <path d="M0 23.5 H40 M39.5 0 V24" stroke="#A6E1FA" stroke-width="2"/>
    </pattern>
    <pattern id="checker" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#E2E8F0"/>
      <rect width="40" height="40" fill="#CBD5E1"/>
      <rect x="40" y="40" width="40" height="40" fill="#CBD5E1"/>
    </pattern>
    <g id="chair">
      <rect x="-36" y="-90" width="72" height="70" rx="14" fill="#F28C6B"/>
      <rect x="-40" y="-24" width="80" height="16" rx="6" fill="#D9734F"/>
      <path d="M-30 -8 L-36 70 M30 -8 L36 70" stroke="#8A5A3B" stroke-width="8" stroke-linecap="round"/>
    </g>
    <clipPath id="winClip"><rect x="84" y="124" width="172" height="232"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="600" width="1600" height="300" fill="url(#checker)"/>
  <rect y="600" width="1600" height="300" fill="#F8FAFC" opacity="0.35"/>

  <!-- janela à esquerda -->
  <rect x="70" y="110" width="200" height="260" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <rect x="84" y="124" width="172" height="232" fill="#BFE7FB"/>
  <g clip-path="url(#winClip)">
    <circle cx="200" cy="300" r="70" fill="#8CC97A"/>
    <circle cx="120" cy="320" r="56" fill="#6DBE6A"/>
  </g>
  <rect x="166" y="124" width="8" height="232" fill="#F8FAFC"/>
  <rect x="60" y="368" width="220" height="12" rx="4" fill="#E2E8F0"/>

  <!-- armários superiores -->
  <rect x="320" y="80" width="800" height="190" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>
  <g fill="none" stroke="#E2E8F0" stroke-width="4">
    <line x1="520" y1="80" x2="520" y2="270"/><line x1="720" y1="80" x2="720" y2="270"/><line x1="920" y1="80" x2="920" y2="270"/>
  </g>
  <g fill="#0A2472">
    <rect x="500" y="220" width="8" height="34" rx="4"/><rect x="532" y="220" width="8" height="34" rx="4"/>
    <rect x="700" y="220" width="8" height="34" rx="4"/><rect x="932" y="220" width="8" height="34" rx="4"/>
    <rect x="1100" y="220" width="8" height="34" rx="4"/>
  </g>
  <rect x="320" y="270" width="800" height="10" fill="#001C55" opacity="0.08"/>
  <!-- prateleira aberta com canecas no armário do meio -->
  <rect x="740" y="96" width="160" height="150" fill="#E7F0F7"/>
  <rect x="740" y="170" width="160" height="8" fill="#B98A62"/>
  <rect x="740" y="238" width="160" height="8" fill="#B98A62"/>
  <g>
    <rect x="756" y="140" width="26" height="30" rx="4" fill="#0E6BA8"/>
    <rect x="792" y="140" width="26" height="30" rx="4" fill="#F28C6B"/>
    <rect x="828" y="140" width="26" height="30" rx="4" fill="#A6E1FA"/>
    <rect x="864" y="140" width="26" height="30" rx="4" fill="#0A2472"/>
    <rect x="760" y="206" width="56" height="32" rx="4" fill="#FACC6B"/>
    <rect x="826" y="196" width="22" height="42" rx="6" fill="#7BD389"/>
    <rect x="856" y="210" width="34" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  </g>

  <!-- azulejos -->
  <rect x="320" y="280" width="800" height="164" fill="url(#tiles)"/>

  <!-- bancada -->
  <rect x="300" y="440" width="840" height="22" rx="4" fill="#B98A62"/>
  <rect x="320" y="462" width="800" height="138" fill="#0E6BA8"/>
  <g fill="none" stroke="#0A2472" stroke-width="3" opacity="0.5">
    <line x1="520" y1="462" x2="520" y2="600"/><line x1="720" y1="462" x2="720" y2="600"/><line x1="920" y1="462" x2="920" y2="600"/>
  </g>
  <g fill="#A6E1FA">
    <rect x="490" y="482" width="20" height="6" rx="3"/><rect x="530" y="482" width="20" height="6" rx="3"/>
    <rect x="690" y="482" width="20" height="6" rx="3"/><rect x="930" y="482" width="20" height="6" rx="3"/>
    <rect x="1090" y="482" width="20" height="6" rx="3"/>
  </g>
  <rect x="320" y="586" width="800" height="14" fill="#0A2472"/>

  <!-- lava-loiça e torneira -->
  <rect x="400" y="438" width="170" height="8" rx="3" fill="#94A3B8"/>
  <path d="M470 438 V372 a26 26 0 0 1 52 0 V388" fill="none" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
  <rect x="458" y="424" width="24" height="16" rx="4" fill="#64748B"/>
  <!-- detergente e planta -->
  <rect x="590" y="396" width="22" height="44" rx="6" fill="#7BD389"/>
  <rect x="596" y="386" width="10" height="12" fill="#F8FAFC"/>
  <rect x="340" y="408" width="40" height="32" rx="4" fill="#F28C6B"/>
  <path d="M360 408 C340 380 344 364 352 360 C360 380 364 392 360 408 Z M360 408 C380 382 384 370 378 362 C368 376 362 392 360 408 Z" fill="#4E9A54"/>

  <!-- micro-ondas -->
  <rect x="650" y="340" width="180" height="100" rx="8" fill="#334155"/>
  <rect x="664" y="354" width="114" height="72" rx="4" fill="#0F172A"/>
  <path d="M672 420 L730 360 L752 360 L694 420 Z" fill="#FFFFFF" opacity="0.12"/>
  <rect x="790" y="356" width="28" height="16" rx="3" fill="#7BD389"/>
  <g fill="#94A3B8">
    <circle cx="796" cy="388" r="4"/><circle cx="812" cy="388" r="4"/>
    <circle cx="796" cy="402" r="4"/><circle cx="812" cy="402" r="4"/>
    <circle cx="796" cy="416" r="4"/><circle cx="812" cy="416" r="4"/>
  </g>

  <!-- máquina de café -->
  <rect x="890" y="320" width="130" height="120" rx="10" fill="#0A2472"/>
  <rect x="890" y="320" width="130" height="34" rx="10" fill="#001C55"/>
  <rect x="906" y="330" width="46" height="14" rx="4" fill="#A6E1FA"/>
  <circle cx="996" cy="337" r="7" fill="#F28C6B"/>
  <rect x="916" y="360" width="78" height="56" rx="4" fill="#001C55"/>
  <rect x="944" y="360" width="22" height="14" fill="#64748B"/>
  <path d="M951 374 V392" stroke="#8A5A3B" stroke-width="4"/>
  <rect x="938" y="394" width="34" height="22" rx="4" fill="#F8FAFC"/>
  <path d="M972 400 h6 a6 6 0 0 1 0 12 h-6" fill="none" stroke="#F8FAFC" stroke-width="3"/>
  <rect x="908" y="428" width="94" height="8" rx="3" fill="#334155"/>
  <path d="M948 300 c-8 -10 8 -16 0 -26 M960 304 c-8 -10 8 -16 0 -26" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- chaleira -->
  <path d="M1050 440 L1056 384 H1100 L1106 440 Z" fill="#F28C6B"/>
  <path d="M1066 384 a12 10 0 0 1 24 0" fill="none" stroke="#334155" stroke-width="5"/>
  <path d="M1056 404 L1040 394" stroke="#F28C6B" stroke-width="8" stroke-linecap="round"/>

  <!-- frigorífico -->
  <rect x="1170" y="90" width="200" height="510" rx="16" fill="url(#steel)" stroke="#CBD5E1" stroke-width="4"/>
  <line x1="1172" y1="270" x2="1368" y2="270" stroke="#CBD5E1" stroke-width="5"/>
  <rect x="1190" y="140" width="10" height="100" rx="5" fill="#64748B"/>
  <rect x="1190" y="296" width="10" height="150" rx="5" fill="#64748B"/>
  <!-- ímanes e notas no frigorífico -->
  <rect x="1250" y="130" width="54" height="64" fill="#FACC6B" transform="rotate(4 1277 162)"/>
  <rect x="1300" y="320" width="50" height="60" fill="#A6E1FA" transform="rotate(-5 1325 350)"/>
  <rect x="1236" y="350" width="46" height="46" fill="#FFFFFF" transform="rotate(3 1259 373)"/>
  <circle cx="1276" cy="134" r="6" fill="#F28C6B"/>
  <circle cx="1324" cy="322" r="6" fill="#0E6BA8"/>
  <circle cx="1258" cy="352" r="6" fill="#7BD389"/>
  <rect x="1180" y="596" width="180" height="8" fill="#001C55" opacity="0.15"/>

  <!-- relógio de parede -->
  <circle cx="1470" cy="170" r="54" fill="#F8FAFC" stroke="#0A2472" stroke-width="8"/>
  <path d="M1470 170 V130 M1470 170 L1496 182" stroke="#0A2472" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1470" cy="170" r="6" fill="#F28C6B"/>

  <!-- mesa redonda com cadeiras -->
  <use href="#chair" x="620" y="760"/>
  <use href="#chair" x="1100" y="760"/>
  <ellipse cx="860" cy="860" rx="260" ry="22" fill="#001C55" opacity="0.14"/>
  <rect x="848" y="700" width="24" height="150" fill="#334155"/>
  <ellipse cx="860" cy="852" rx="90" ry="14" fill="#334155"/>
  <ellipse cx="860" cy="704" rx="240" ry="44" fill="#B98A62"/>
  <ellipse cx="860" cy="694" rx="240" ry="44" fill="#D9BC98"/>
  <!-- fruteira e canecas -->
  <path d="M800 690 a60 22 0 0 0 120 0 Z" fill="#F8FAFC"/>
  <circle cx="836" cy="680" r="16" fill="#F28C6B"/>
  <circle cx="864" cy="674" r="16" fill="#FACC6B"/>
  <circle cx="890" cy="682" r="14" fill="#7BD389"/>
  <rect x="700" y="664" width="26" height="28" rx="4" fill="#0E6BA8"/>
  <rect x="990" y="666" width="26" height="28" rx="4" fill="#F8FAFC" stroke="#0A2472" stroke-width="3"/>
  <use href="#chair" x="860" y="800"/>
</svg>
