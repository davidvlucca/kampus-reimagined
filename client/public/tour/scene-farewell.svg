<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD0F0"/>
      <stop offset="0.55" stop-color="#FCE3CF"/>
      <stop offset="1" stop-color="#FFF4D6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E1FA"/>
      <stop offset="0.55" stop-color="#5FA9D6"/>
      <stop offset="1" stop-color="#0E6BA8"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B7FB5"/>
      <stop offset="1" stop-color="#0A2472"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CC97A"/>
      <stop offset="1" stop-color="#5E9F57"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#FFF4D6"/>
    </linearGradient>
    <!-- pessoa a andar, vista de costas (camisola herda a cor do use) -->
    <g id="walker">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#001C55" opacity="0.18"/>
      <rect x="-17" y="-62" width="14" height="60" rx="6" fill="#001C55"/>
      <rect x="3" y="-60" width="14" height="54" rx="6" fill="#001C55"/>
      <rect x="-28" y="-130" width="56" height="78" rx="22"/>
      <rect x="-36" y="-124" width="14" height="56" rx="7" transform="rotate(10 -29 -124)"/>
      <rect x="22" y="-124" width="14" height="56" rx="7" transform="rotate(-10 29 -124)"/>
      <rect x="-7" y="-142" width="14" height="14" fill="#C68B5E"/>
      <circle cy="-156" r="21" fill="#3B2A20"/>
      <ellipse cx="-20" cy="-152" rx="4" ry="6" fill="#C68B5E"/>
      <ellipse cx="20" cy="-152" rx="4" ry="6" fill="#C68B5E"/>
    </g>
    <g id="win">
      <rect width="96" height="74" rx="4" fill="url(#glass)"/>
      <path d="M8 66 L60 8 L80 8 L28 66 Z" fill="#FFFFFF" opacity="0.28"/>
      <rect x="46" width="4" height="74" fill="#F8FAFC" opacity="0.7"/>
    </g>
    <g id="tree">
      <rect x="-9" y="-20" width="18" height="120" rx="6" fill="#8A5A3B"/>
      <circle cx="0" cy="-90" r="78" fill="#4E9A54"/>
      <circle cx="-48" cy="-50" r="56" fill="#5DAE5F"/>
      <circle cx="46" cy="-44" r="60" fill="#468B4C"/>
      <circle cx="-14" cy="-120" r="44" fill="#6DBE6A"/>
      <circle cx="20" cy="-70" r="40" fill="#5DAE5F" opacity="0.8"/>
    </g>
  </defs>

  <!-- céu -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1460" cy="160" r="150" fill="#FDE68A" opacity="0.25"/>
  <circle cx="1460" cy="160" r="96" fill="#FFF4D6" opacity="0.5"/>
  <circle cx="1460" cy="160" r="62" fill="#FFF1C2"/>
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="260" cy="120" rx="110" ry="30"/>
    <ellipse cx="320" cy="98" rx="70" ry="34"/>
    <ellipse cx="1040" cy="80" rx="90" ry="24"/>
    <ellipse cx="1090" cy="62" rx="54" ry="26"/>
  </g>

  <!-- edifícios ao fundo -->
  <g fill="#C7B8C8" opacity="0.55">
    <rect x="60" y="300" width="180" height="340"/>
    <rect x="1380" y="260" width="170" height="380"/>
    <rect x="1250" y="340" width="120" height="300"/>
  </g>

  <!-- chão -->
  <rect y="630" width="1600" height="270" fill="url(#grass)"/>

  <!-- edifício principal: bloco esquerdo -->
  <rect x="300" y="210" width="420" height="430" fill="#F8FAFC"/>
  <rect x="300" y="210" width="420" height="22" fill="#E2E8F0"/>
  <g>
    <use href="#win" x="330" y="260"/><use href="#win" x="450" y="260"/><use href="#win" x="570" y="260"/>
    <use href="#win" x="330" y="370"/><use href="#win" x="450" y="370"/><use href="#win" x="570" y="370"/>
    <use href="#win" x="330" y="480"/><use href="#win" x="450" y="480"/><use href="#win" x="570" y="480"/>
  </g>
  <!-- palas de sombra -->
  <g fill="#E2E8F0">
    <rect x="320" y="334" width="380" height="10"/>
    <rect x="320" y="444" width="380" height="10"/>
    <rect x="320" y="554" width="380" height="10"/>
  </g>

  <!-- bloco direito -->
  <rect x="880" y="250" width="440" height="390" fill="#F1F5F9"/>
  <rect x="880" y="250" width="440" height="22" fill="#E2E8F0"/>
  <g>
    <use href="#win" x="910" y="300"/><use href="#win" x="1030" y="300"/><use href="#win" x="1150" y="300"/>
    <use href="#win" x="910" y="410"/><use href="#win" x="1030" y="410"/><use href="#win" x="1150" y="410"/>
    <use href="#win" x="910" y="520"/><use href="#win" x="1030" y="520"/><use href="#win" x="1150" y="520"/>
  </g>
  <g fill="#E2E8F0">
    <rect x="900" y="374" width="400" height="10"/>
    <rect x="900" y="484" width="400" height="10"/>
    <rect x="900" y="594" width="400" height="10"/>
  </g>
  <!-- ripado de madeira no bloco direito -->
  <g fill="#C08A5B">
    <rect x="1280" y="290" width="10" height="350"/>
    <rect x="1298" y="290" width="10" height="350"/>
  </g>

  <!-- átrio central de vidro -->
  <rect x="700" y="130" width="200" height="510" fill="#0A2472"/>
  <rect x="712" y="146" width="176" height="494" fill="url(#glassDark)"/>
  <g stroke="#A6E1FA" stroke-width="3" opacity="0.55">
    <line x1="756" y1="146" x2="756" y2="640"/>
    <line x1="800" y1="146" x2="800" y2="640"/>
    <line x1="844" y1="146" x2="844" y2="640"/>
    <line x1="712" y1="250" x2="888" y2="250"/>
    <line x1="712" y1="360" x2="888" y2="360"/>
  </g>
  <path d="M720 440 L860 160 L888 160 L888 190 L760 440 Z" fill="#FFFFFF" opacity="0.14"/>
  <!-- sinal (sem texto): logótipo abstrato -->
  <rect x="740" y="166" width="120" height="56" rx="10" fill="#F8FAFC"/>
  <circle cx="776" cy="194" r="16" fill="#0E6BA8"/>
  <rect x="800" y="184" width="44" height="8" rx="4" fill="#0A2472"/>
  <rect x="800" y="198" width="30" height="8" rx="4" fill="#A6E1FA"/>

  <!-- pala da entrada -->
  <rect x="660" y="448" width="280" height="18" rx="4" fill="#001C55"/>
  <rect x="660" y="466" width="280" height="8" fill="#001C55" opacity="0.18"/>
  <!-- portas de vidro abertas: luz quente do átrio -->
  <rect x="722" y="474" width="156" height="166" fill="#0A2472"/>
  <rect x="728" y="480" width="144" height="160" fill="url(#hall)"/>
  <rect x="760" y="560" width="80" height="44" rx="4" fill="#0E6BA8"/>
  <rect x="754" y="552" width="92" height="10" rx="3" fill="#D9B48F"/>
  <rect x="788" y="500" width="24" height="12" rx="6" fill="#F28C6B" opacity="0.8"/>
  <rect x="728" y="620" width="144" height="20" fill="#E2E8F0" opacity="0.8"/>
  <rect x="728" y="480" width="26" height="160" fill="#A6E1FA" opacity="0.9"/>
  <rect x="846" y="480" width="26" height="160" fill="#A6E1FA" opacity="0.9"/>
  <rect x="744" y="540" width="6" height="40" rx="3" fill="#001C55"/>
  <rect x="850" y="540" width="6" height="40" rx="3" fill="#001C55"/>
  <path d="M728 640 L872 640 L940 700 L660 700 Z" fill="#FDE68A" opacity="0.35"/>

  <g fill="#FDE68A" opacity="0.1"><rect x="300" y="210" width="400" height="430"/><rect x="900" y="250" width="420" height="390"/></g>
  <!-- base / passeio frente ao edifício -->
  <rect x="280" y="636" width="1060" height="16" fill="#CBD5E1"/>
  <!-- caminho -->
  <path d="M720 652 L880 652 L1080 900 L520 900 Z" fill="url(#path)"/>
  <g stroke="#F8FAFC" stroke-width="4" opacity="0.8">
    <line x1="660" y1="720" x2="940" y2="720"/>
    <line x1="610" y1="800" x2="990" y2="800"/>
  </g>

  <!-- sebes e canteiros -->
  <g fill="#3F8448">
    <rect x="300" y="610" width="380" height="40" rx="20"/>
    <rect x="920" y="610" width="400" height="40" rx="20"/>
  </g>
  <g fill="#F28C6B">
    <circle cx="340" cy="612" r="6"/><circle cx="420" cy="608" r="6"/><circle cx="520" cy="614" r="6"/><circle cx="610" cy="608" r="6"/>
    <circle cx="970" cy="610" r="6"/><circle cx="1080" cy="606" r="6"/><circle cx="1180" cy="612" r="6"/><circle cx="1270" cy="608" r="6"/>
  </g>

  <!-- árvores -->
  <ellipse cx="200" cy="700" rx="110" ry="16" fill="#001C55" opacity="0.15"/>
  <use href="#tree" x="200" y="600"/>
  <ellipse cx="1440" cy="710" rx="110" ry="16" fill="#001C55" opacity="0.15"/>
  <use href="#tree" x="1440" y="612"/>

  <!-- candeeiros de rua -->
  <g fill="#001C55">
    <rect x="626" y="560" width="6" height="92"/>
    <rect x="968" y="560" width="6" height="92"/>
  </g>
  <circle cx="629" cy="556" r="12" fill="#E2E8F0"/>
  <circle cx="971" cy="556" r="12" fill="#E2E8F0"/>

  <!-- bicicletas estacionadas (direita) -->
  <g stroke="#0E6BA8" stroke-width="5" fill="none">
    <circle cx="1130" cy="690" r="22"/><circle cx="1190" cy="690" r="22"/>
    <path d="M1130 690 L1155 660 L1190 690 M1155 660 L1175 660"/>
  </g>
  <g stroke="#F28C6B" stroke-width="5" fill="none">
    <circle cx="1230" cy="694" r="22"/><circle cx="1290" cy="694" r="22"/>
    <path d="M1230 694 L1255 664 L1290 694 M1255 664 L1275 664"/>
  </g>

  <!-- pessoas a entrar -->
  <g fill="#0E6BA8"><use href="#walker" transform="translate(782 648) scale(0.5)"/></g>
  <g fill="#F28C6B"><use href="#walker" transform="translate(842 688) scale(0.62)"/></g>
  <rect x="829" y="612" width="26" height="30" rx="8" fill="#0A2472"/>
  <g fill="#86EFAC"><use href="#walker" transform="translate(740 740) scale(0.76)"/></g>
</svg>
