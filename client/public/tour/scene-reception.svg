  <rect x="486" y="174" width="8" height="406" fill="#001C55"/>
  <path d="M384 560 L470 200 L484 200 L404 560 Z" fill="#FFFFFF" opacity="0.35"/>
  <path d="M500 560 L590 200 L604 200 L520 560 Z" fill="#FFFFFF" opacity="0.3"/>
  <rect x="470" y="350" width="8" height="70" rx="4" fill="#E2E8F0"/>
