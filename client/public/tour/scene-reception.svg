    <use href="#leaf" transform="translate(1145 368) rotate(18) scale(0.55)"/>
  </g>

  </g>

  <!-- fila de cacifos na parede (direita) -->
  <ellipse cx="1314" cy="596" rx="220" ry="12" fill="#001C55" opacity="0.12"/>
  <rect x="1118" y="196" width="392" height="10" rx="4" fill="#0A2472"/>
  <rect x="1118" y="206" width="392" height="384" fill="#0A2472"/>
  <use href="#locker" x="1130" y="214"/>
  <use href="#locker" x="1222" y="214"/>
  <use href="#locker" x="1314" y="214"/>
  <use href="#locker" x="1406" y="214"/>
  <use href="#locker" x="1130" y="338"/>
  <use href="#locker" x="1222" y="338"/>
  <use href="#locker" x="1314" y="338"/>
  <use href="#locker" x="1406" y="338"/>
