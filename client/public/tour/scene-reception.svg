<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F0F7"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC6EE"/>
      <stop offset="1" stop-color="#D6F0FC"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E1FA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E6BA8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6BA8"/>
      <stop offset="1" stop-color="#0A2472"/>
    </linearGradient>
    <clipPath id="doorClip"><rect x="374" y="174" width="232" height="406"/></clipPath>
    <!-- cacifo (uma porta) -->
    <g id="locker">
      <rect width="86" height="118" rx="4" fill="#0E6BA8"/>
      <rect x="4" y="4" width="78" height="110" rx="3" fill="#1E7DBA"/>
      <g fill="#A6E1FA" opacity="0.8">
        <rect x="16" y="16" width="44" height="5" rx="2.5"/><rect x="16" y="26" width="44" height="5" rx="2.5"/><rect x="16" y="36" width="44" height="5" rx="2.5"/>
      </g>
      <rect x="66" y="52" width="8" height="26" rx="4" fill="#F8FAFC"/>
      <rect x="16" y="92" width="18" height="10" rx="3" fill="#F8FAFC" opacity="0.85"/>
    </g>
    <g id="leaf"><path d="M0 0 C-30 -20 -40 -60 -20 -90 C10 -60 14 -24 0 0 Z"/></g>
  </defs>

  <!-- parede e chão -->
  <rect width="1600" height="900" fill="url(#wall)"/>
