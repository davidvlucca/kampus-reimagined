  <rect y="590" width="1600" height="310" fill="url(#floor)"/>
  <rect y="582" width="1600" height="12" fill="#CBD5E1"/>
  <g stroke="#F8FAFC" stroke-width="3" opacity="0.7">
    <line x1="0" y1="680" x2="1600" y2="680"/>
    <line x1="0" y1="790" x2="1600" y2="790"/>
    <line x1="400" y1="594" x2="200" y2="900"/>
    <line x1="800" y1="594" x2="800" y2="900"/>
    <line x1="1200" y1="594" x2="1400" y2="900"/>
