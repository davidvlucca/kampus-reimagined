  <rect x="880" y="200" width="160" height="80" rx="14" fill="#F8FAFC"/>
  <circle cx="926" cy="240" r="22" fill="#0E6BA8"/>
  <rect x="958" y="226" width="62" height="10" rx="5" fill="#0A2472"/>
  <rect x="958" y="244" width="42" height="10" rx="5" fill="#A6E1FA"/>

