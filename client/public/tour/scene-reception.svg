  <rect x="988" y="338" width="104" height="60" rx="3" fill="#E8F6FD"/>
  <rect x="998" y="348" width="50" height="8" rx="3" fill="#0E6BA8"/>
  <rect x="998" y="362" width="80" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="998" y="374" width="64" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="1032" y="398" width="16" height="4" fill="#334155"/>
  <rect x="800" y="380" width="34" height="22" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="806" y="372" width="30" height="10" rx="3" fill="#F28C6B"/>
  <rect x="880" y="372" width="24" height="30" rx="4" fill="#F8FAFC" stroke="#0E6BA8" stroke-width="3"/>
  <path d="M904 380 h6 a6 6 0 0 1 0 12 h-6" fill="none" stroke="#0E6BA8" stroke-width="3"/>
  <path d="M1124 400 L1130 366 H1160 L1166 400 Z" fill="#F28C6B"/>
  <g fill="#4E9A54">
