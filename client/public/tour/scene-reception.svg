  <rect x="120" y="770" width="360" height="40" rx="18" fill="#0E6BA8"/>
  <rect x="120" y="720" width="360" height="60" rx="20" fill="#0A2472"/>
  <rect x="150" y="810" width="12" height="40" fill="#475569"/>
  <rect x="438" y="810" width="12" height="40" fill="#475569"/>
