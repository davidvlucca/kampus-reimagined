      <g fill="#475569" opacity="0.55"><rect x="16" y="22" width="16" height="22" rx="2"/><rect x="58" y="22" width="16" height="22" rx="2"/><rect x="16" y="62" width="16" height="22" rx="2"/><rect x="58" y="62" width="16" height="22" rx="2"/></g>
    </g>
    <!-- prédio com telhado de quatro águas -->
