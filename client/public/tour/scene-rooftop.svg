    </g>
    <g id="leaf"><path d="M0 0 C-30 -20 -40 -60 -20 -90 C10 -60 14 -24 0 0 Z"/></g>
    <!-- vaso com planta -->
    <g id="pot">
      <path d="M-40 0 L-32 -70 H32 L40 0 Z" fill="#C8653F"/>
      <rect x="-36" y="-78" width="72" height="12" rx="4" fill="#D9734F"/>
      <g fill="#3F8448">
        <use href="#leaf" transform="translate(0 -76) rotate(-35) scale(1.3)"/>
        <use href="#leaf" transform="translate(0 -76) rotate(8) scale(1.6)"/>
      </g>
      <g fill="#5DAE5F">
        <use href="#leaf" transform="translate(0 -76) rotate(38) scale(1.2)"/>
        <use href="#leaf" transform="translate(0 -76) rotate(-68) scale(1)"/>
        <use href="#leaf" transform="translate(0 -76) rotate(70) scale(0.9)"/>
      </g>
    </g>
