<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC6EE"/>
      <stop offset="0.65" stop-color="#C9EBFB"/>
      <stop offset="1" stop-color="#FFF4D6"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FA9D6"/>
      <stop offset="1" stop-color="#0E6BA8"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B48F"/>
      <stop offset="1" stop-color="#B98A62"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6E1FA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E8F6FD" stop-opacity="0.45"/>
