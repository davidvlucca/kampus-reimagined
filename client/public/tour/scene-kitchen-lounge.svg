    </pattern>
    <g id="leaf"><path d="M0 0 C-30 -20 -40 -60 -20 -90 C10 -60 14 -24 0 0 Z"/></g>
    <g id="pb"><rect x="-6" y="-14" width="12" height="20" rx="4" fill="#0E6BA8"/><circle cy="-18" r="6" fill="#0E6BA8"/></g>
    <g id="pr"><rect x="-6" y="-14" width="12" height="20" rx="4" fill="#F28C6B"/><circle cy="-18" r="6" fill="#F28C6B"/></g>
