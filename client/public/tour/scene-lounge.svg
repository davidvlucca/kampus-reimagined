<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F0F7"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A27E"/>
      <stop offset="1" stop-color="#A97F5A"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DAE5F"/>
      <stop offset="1" stop-color="#3F8448"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#FFF4D6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFF4D6" stop-opacity="0"/>
    </radialGradient>
    <g id="leaf"><path d="M0 0 C-30 -20 -40 -60 -20 -90 C10 -60 14 -24 0 0 Z"/></g>
    <!-- jogador de matraquilhos -->
    <g id="pb"><rect x="-6" y="-14" width="12" height="20" rx="4" fill="#0E6BA8"/><circle cy="-18" r="6" fill="#0E6BA8"/></g>
    <g id="pr"><rect x="-6" y="-14" width="12" height="20" rx="4" fill="#F28C6B"/><circle cy="-18" r="6" fill="#F28C6B"/></g>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect y="580" width="1600" height="320" fill="url(#floor)"/>
  <rect y="572" width="1600" height="12" fill="#E2E8F0"/>

  <!-- parede de destaque atrás do sofá -->
  <rect x="200" y="0" width="740" height="572" fill="#0A2472"/>
  <rect x="200" y="0" width="740" height="572" fill="#0E6BA8" opacity="0.25"/>
  <!-- quadros -->
  <rect x="300" y="110" width="200" height="150" rx="6" fill="#F8FAFC"/>
  <rect x="314" y="124" width="172" height="122" fill="#A6E1FA"/>
  <circle cx="440" cy="160" r="20" fill="#FACC6B"/>
  <path d="M314 246 L370 180 L410 220 L440 196 L486 246 Z" fill="#0E6BA8"/>
  <rect x="540" y="90" width="130" height="170" rx="6" fill="#F8FAFC"/>
  <rect x="554" y="104" width="102" height="142" fill="#FCD3C4"/>
  <circle cx="605" cy="175" r="36" fill="#F28C6B"/>
  <rect x="710" y="130" width="150" height="130" rx="6" fill="#F8FAFC"/>
  <rect x="724" y="144" width="122" height="102" fill="#E8F6FD"/>
  <path d="M740 230 C770 150 800 230 830 160" fill="none" stroke="#0E6BA8" stroke-width="8" stroke-linecap="round"/>

  <!-- sofá -->
  <ellipse cx="580" cy="590" rx="340" ry="18" fill="#001C55" opacity="0.18"/>
  <rect x="270" y="340" width="620" height="140" rx="30" fill="#F28C6B"/>
  <rect x="290" y="440" width="580" height="90" rx="22" fill="#E07A58"/>
  <rect x="300" y="430" width="270" height="60" rx="18" fill="#F49A7C"/>
  <rect x="590" y="430" width="270" height="60" rx="18" fill="#F49A7C"/>
  <rect x="240" y="400" width="80" height="150" rx="30" fill="#D9734F"/>
  <rect x="840" y="400" width="80" height="150" rx="30" fill="#D9734F"/>
  <rect x="300" y="540" width="14" height="30" fill="#8A5A3B"/>
  <rect x="846" y="540" width="14" height="30" fill="#8A5A3B"/>
  <!-- almofadas -->
  <rect x="320" y="364" width="96" height="86" rx="20" fill="#A6E1FA" transform="rotate(-8 368 407)"/>
  <rect x="440" y="372" width="90" height="80" rx="20" fill="#FACC6B" transform="rotate(5 485 412)"/>
  <rect x="730" y="366" width="96" height="86" rx="20" fill="#F8FAFC" transform="rotate(8 778 409)"/>
  <circle cx="778" cy="409" r="16" fill="#0E6BA8"/>

  <!-- candeeiro de arco -->
  <ellipse cx="240" cy="568" rx="40" ry="10" fill="#334155"/>
  <path d="M240 566 V320 C240 240 420 220 484 290" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M440 320 a44 44 0 0 1 88 0 Z" fill="#FACC6B" transform="rotate(12 484 320)"/>
  <path d="M446 330 L400 440 H580 L530 330 Z" fill="url(#glow)" opacity="0.6"/>

  <!-- mesa de centro -->
  <ellipse cx="580" cy="660" rx="170" ry="34" fill="#B98A62"/>
  <ellipse cx="580" cy="652" rx="170" ry="34" fill="#D9BC98"/>
  <rect x="500" y="680" width="10" height="60" fill="#8A5A3B"/>
  <rect x="650" y="680" width="10" height="60" fill="#8A5A3B"/>
  <rect x="520" y="630" width="80" height="12" rx="3" fill="#0E6BA8"/>
  <rect x="528" y="620" width="66" height="12" rx="3" fill="#F28C6B"/>
  <rect x="630" y="618" width="26" height="28" rx="4" fill="#F8FAFC" stroke="#0A2472" stroke-width="3"/>

  <!-- prateleira com livros sobre os matraquilhos -->
  <rect x="1060" y="170" width="300" height="14" fill="#B98A62"/>
  <g>
    <rect x="1080" y="114" width="20" height="56" fill="#0E6BA8"/>
    <rect x="1104" y="124" width="18" height="46" fill="#F28C6B"/>
    <rect x="1126" y="108" width="22" height="62" fill="#0A2472"/>
    <rect x="1152" y="120" width="16" height="50" fill="#FACC6B" transform="rotate(10 1160 170)"/>
    <rect x="1300" y="132" width="40" height="38" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <g fill="#4E9A54">
      <use href="#leaf" transform="translate(1320 132) rotate(-35) scale(0.7)"/>
      <use href="#leaf" transform="translate(1320 132) rotate(20) scale(0.8)"/>
    </g>
    <rect x="1210" y="130" width="60" height="40" rx="6" fill="#A6E1FA"/>
    <circle cx="1240" cy="150" r="10" fill="#0A2472"/>
  </g>

  <!-- matraquilhos -->
  <ellipse cx="1210" cy="640" rx="250" ry="16" fill="#001C55" opacity="0.18"/>
  <g fill="#334155">
    <rect x="1010" y="500" width="22" height="140" rx="4"/>
    <rect x="1388" y="500" width="22" height="140" rx="4"/>
  </g>
  <rect x="1060" y="500" width="300" height="16" fill="#334155" opacity="0.6"/>
  <!-- caixa -->
  <path d="M990 350 H1430 L1450 430 V500 H970 V430 Z" fill="#0A2472"/>
  <path d="M990 350 H1430 L1450 430 H970 Z" fill="#001C55"/>
  <!-- campo -->
  <path d="M1010 362 H1410 L1424 422 H996 Z" fill="url(#field)"/>
  <g fill="none" stroke="#F8FAFC" stroke-width="3" opacity="0.8">
    <path d="M1010 362 H1410 L1424 422 H996 Z"/>
    <line x1="1210" y1="362" x2="1210" y2="422"/>
    <ellipse cx="1210" cy="392" rx="26" ry="10"/>
  </g>
  <rect x="1003" y="380" width="10" height="24" fill="#F8FAFC"/>
  <rect x="1408" y="380" width="10" height="24" fill="#F8FAFC"/>
  <!-- varões e jogadores -->
  <g stroke="#CBD5E1" stroke-width="5" stroke-linecap="round">
    <line x1="1060" y1="330" x2="1052" y2="452"/>
    <line x1="1130" y1="330" x2="1126" y2="452"/>
    <line x1="1290" y1="330" x2="1294" y2="452"/>
    <line x1="1360" y1="330" x2="1368" y2="452"/>
  </g>
  <g fill="#001C55">
    <rect x="1044" y="452" width="16" height="40" rx="7"/><rect x="1118" y="452" width="16" height="40" rx="7"/>
    <rect x="1286" y="452" width="16" height="40" rx="7"/><rect x="1360" y="452" width="16" height="40" rx="7"/>
  </g>
  <use href="#pb" x="1058" y="378"/><use href="#pb" x="1055" y="412"/>
  <use href="#pr" x="1129" y="372"/><use href="#pr" x="1128" y="396"/><use href="#pr" x="1127" y="420"/>
  <use href="#pb" x="1291" y="372"/><use href="#pb" x="1292" y="396"/><use href="#pb" x="1293" y="420"/>
  <use href="#pr" x="1363" y="378"/><use href="#pr" x="1366" y="412"/>
  <circle cx="1200" cy="398" r="7" fill="#FFFFFF"/>
  <!-- marcadores -->
  <g fill="#A6E1FA"><circle cx="1180" cy="344" r="5"/><circle cx="1196" cy="344" r="5"/></g>
  <g fill="#F28C6B"><circle cx="1224" cy="344" r="5"/><circle cx="1240" cy="344" r="5"/></g>

  <!-- planta alta à esquerda -->
  <path d="M60 570 L74 470 H156 L170 570 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <g fill="#3F8448">
    <use href="#leaf" transform="translate(115 470) rotate(-35) scale(2.6)"/>
    <use href="#leaf" transform="translate(115 470) rotate(5) scale(3)"/>
  </g>
  <g fill="#5DAE5F">
    <use href="#leaf" transform="translate(115 470) rotate(35) scale(2.4)"/>
    <use href="#leaf" transform="translate(115 470) rotate(-65) scale(1.8)"/>
    <use href="#leaf" transform="translate(115 470) rotate(62) scale(1.8)"/>
  </g>

  <!-- planta à direita -->
  <path d="M1480 572 L1490 490 H1560 L1570 572 Z" fill="#F28C6B"/>
  <g fill="#4E9A54">
    <ellipse cx="1525" cy="430" rx="28" ry="66"/>
    <ellipse cx="1490" cy="448" rx="20" ry="50" transform="rotate(-25 1490 448)"/>
    <ellipse cx="1560" cy="452" rx="20" ry="48" transform="rotate(25 1560 452)"/>
  </g>

  <!-- puff em primeiro plano -->
  <ellipse cx="1000" cy="800" rx="110" ry="20" fill="#001C55" opacity="0.15"/>
  <path d="M900 790 C890 700 960 670 1010 680 C1080 690 1110 740 1100 790 Z" fill="#0E6BA8"/>
  <path d="M930 720 C960 700 1000 696 1030 706" fill="none" stroke="#A6E1FA" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
</svg>
