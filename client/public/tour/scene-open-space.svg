<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7F0F7"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A27E"/>
      <stop offset="1" stop-color="#A97F5A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E1FA" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5FA9D6" stop-opacity="0.35"/>
    </linearGradient>
    <!-- cabine telefónica de vidro -->
    <g id="booth">
      <ellipse cx="80" cy="330" rx="96" ry="10" fill="#001C55" opacity="0.15"/>
      <rect width="160" height="330" rx="12" fill="#0A2472"/>
      <rect x="10" y="30" width="140" height="290" rx="4" fill="#E8F6FD"/>
      <rect x="10" y="30" width="140" height="120" fill="#0E6BA8" opacity="0.18"/>
      <rect x="10" y="236" width="140" height="10" fill="#D9B48F"/>
      <rect x="10" y="30" width="140" height="290" rx="4" fill="url(#glass)"/>
      <path d="M24 300 L96 44 L116 44 L44 300 Z" fill="#FFFFFF" opacity="0.35"/>
      <rect x="126" y="160" width="8" height="54" rx="4" fill="#F8FAFC"/>
      <g fill="#A6E1FA"><rect x="40" y="12" width="20" height="6" rx="3"/><rect x="70" y="12" width="20" height="6" rx="3"/><rect x="100" y="12" width="20" height="6" rx="3"/></g>
    </g>
    <!-- cadeira vista de frente, atrás da mesa -->
    <g id="chair">
      <rect width="80" height="84" rx="18" fill="#0E6BA8"/>
      <rect x="10" y="10" width="60" height="8" rx="4" fill="#FFFFFF" opacity="0.2"/>
    </g>
    <!-- portátil visto por trás -->
    <g id="lap">
      <path d="M0 0 H110 L104 68 H6 Z" fill="#CBD5E1"/>
      <circle cx="55" cy="32" r="7" fill="#F8FAFC"/>
      <rect x="-6" y="68" width="122" height="6" rx="3" fill="#94A3B8"/>
    </g>
    <g id="leaf"><path d="M0 0 C-30 -20 -40 -60 -20 -90 C10 -60 14 -24 0 0 Z"/></g>
    <g id="lamp">
      <line x1="0" y1="0" x2="0" y2="70" stroke="#334155" stroke-width="3"/>
      <path d="M-34 96 a34 28 0 0 1 68 0 Z" fill="#0A2472"/>
      <ellipse cy="96" rx="22" ry="5" fill="#FDE68A"/>
    </g>
  </defs>

  <!-- parede e chão -->
  <rect width="1600" height="900" fill="url(#wall)"/>
  <rect width="1600" height="40" fill="#E2E8F0"/>
  <rect y="480" width="1600" height="420" fill="url(#floor)"/>
  <rect y="472" width="1600" height="12" fill="#CBD5E1"/>
  <g stroke="#8F6646" stroke-width="2" opacity="0.3">
    <line x1="0" y1="560" x2="1600" y2="560"/>
    <line x1="0" y1="660" x2="1600" y2="660"/>
    <line x1="0" y1="780" x2="1600" y2="780"/>
  </g>

  <!-- janelas altas nas pontas -->
  <rect x="40" y="90" width="200" height="370" rx="6" fill="#F8FAFC"/>
  <rect x="54" y="104" width="172" height="342" fill="#BFE7FB"/>
  <rect x="54" y="340" width="172" height="106" fill="#9CC3DD"/>
  <rect x="136" y="104" width="8" height="342" fill="#F8FAFC"/>
  <rect x="1380" y="90" width="200" height="370" rx="6" fill="#F8FAFC"/>
  <rect x="1394" y="104" width="172" height="342" fill="#BFE7FB"/>
  <rect x="1394" y="320" width="172" height="126" fill="#9CC3DD"/>
  <rect x="1476" y="104" width="8" height="342" fill="#F8FAFC"/>

  <!-- duas cabines telefónicas -->
  <use href="#booth" x="330" y="146"/>
  <use href="#booth" x="520" y="146"/>
  <!-- pessoa ao telefone na primeira cabine -->
  <circle cx="400" cy="262" r="24" fill="#8A5A3B"/>
  <path d="M376 258 a24 24 0 0 1 48 -4 C412 246 394 246 376 258 Z" fill="#001C55"/>
  <rect x="418" y="252" width="8" height="26" rx="4" fill="#001C55"/>
  <path d="M362 382 C362 316 438 316 438 382 Z" fill="#F28C6B"/>
  <rect x="340" y="176" width="140" height="290" fill="url(#glass)" opacity="0.6"/>
  <!-- banco vazio na segunda cabine -->
  <rect x="560" y="400" width="80" height="14" rx="6" fill="#F28C6B"/>
  <rect x="594" y="414" width="12" height="52" fill="#475569"/>

  <!-- sala de reuniões envidraçada ao fundo -->
  <rect x="740" y="120" width="560" height="356" rx="10" fill="#0A2472"/>
  <rect x="752" y="132" width="536" height="344" fill="#E8F6FD"/>
  <!-- ecrã e quadro dentro da sala -->
  <rect x="900" y="168" width="220" height="120" rx="8" fill="#0F172A"/>
  <rect x="910" y="178" width="200" height="100" rx="4" fill="#001C55"/>
  <path d="M924 262 L964 232 L1000 244 L1040 206 L1092 196" fill="none" stroke="#A6E1FA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="924" y="190" width="60" height="8" rx="4" fill="#F28C6B"/>
  <rect x="780" y="170" width="90" height="110" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <g fill="#FDE68A"><rect x="792" y="184" width="28" height="24"/><rect x="828" y="184" width="28" height="24"/></g>
  <rect x="792" y="216" width="28" height="24" fill="#86EFAC"/>
  <rect x="828" y="216" width="28" height="24" fill="#A6E1FA"/>
  <!-- mesa e cadeiras da sala -->
  <rect x="842" y="350" width="60" height="64" rx="14" fill="#F28C6B"/>
  <rect x="932" y="344" width="60" height="70" rx="14" fill="#0E6BA8"/>
  <rect x="1028" y="344" width="60" height="70" rx="14" fill="#F28C6B"/>
  <rect x="1124" y="350" width="60" height="64" rx="14" fill="#0E6BA8"/>
  <rect x="810" y="400" width="410" height="18" rx="6" fill="#D9B48F"/>
  <rect x="830" y="418" width="370" height="8" fill="#B98A62"/>
  <rect x="860" y="426" width="10" height="50" fill="#475569"/>
  <rect x="1160" y="426" width="10" height="50" fill="#475569"/>
  <rect x="960" y="386" width="40" height="14" rx="3" fill="#94A3B8"/>
  <rect x="1050" y="380" width="22" height="20" rx="4" fill="#F8FAFC" stroke="#0A2472" stroke-width="2"/>
  <!-- vidro e caixilhos -->
  <rect x="752" y="132" width="536" height="344" fill="url(#glass)"/>
  <g fill="#0A2472">
    <rect x="884" y="132" width="6" height="344"/>
    <rect x="1150" y="132" width="6" height="344"/>
    <rect x="752" y="318" width="536" height="4" opacity="0.5"/>
  </g>
  <path d="M770 470 L860 140 L880 140 L790 470 Z" fill="#FFFFFF" opacity="0.3"/>
  <path d="M1170 470 L1250 140 L1270 140 L1190 470 Z" fill="#FFFFFF" opacity="0.25"/>
  <rect x="1266" y="280" width="8" height="60" rx="4" fill="#F8FAFC"/>

  <!-- candeeiros pendentes sobre as mesas -->
  <use href="#lamp" x="500" y="40"/>
  <use href="#lamp" x="800" y="40"/>
  <use href="#lamp" x="1100" y="40"/>

  <!-- mesa comprida 1 (meio) -->
  <ellipse cx="800" cy="660" rx="560" ry="14" fill="#001C55" opacity="0.12"/>
  <use href="#chair" x="330" y="470"/>
  <use href="#chair" x="530" y="470"/>
  <use href="#chair" x="730" y="470"/>
  <use href="#chair" x="930" y="470"/>
  <use href="#chair" x="1130" y="470"/>
  <use href="#lap" x="330" y="476"/>
  <use href="#lap" x="740" y="476"/>
  <use href="#lap" x="1130" y="476"/>
  <rect x="280" y="550" width="1040" height="22" rx="6" fill="#D9B48F"/>
  <rect x="296" y="572" width="1008" height="10" fill="#B98A62"/>
  <g fill="#475569">
    <rect x="320" y="582" width="14" height="78"/>
    <rect x="793" y="582" width="14" height="78"/>
    <rect x="1266" y="582" width="14" height="78"/>
  </g>
  <!-- objetos na mesa 1 -->
  <rect x="560" y="530" width="60" height="20" rx="3" fill="#0E6BA8"/>
  <rect x="566" y="520" width="50" height="12" rx="3" fill="#FDE68A"/>
  <rect x="960" y="522" width="24" height="28" rx="4" fill="#F28C6B"/>
  <path d="M984 528 h6 a6 6 0 0 1 0 12 h-6" fill="none" stroke="#F28C6B" stroke-width="3"/>
  <rect x="1020" y="498" width="20" height="52" rx="8" fill="#86EFAC"/>
  <path d="M480 550 L486 520 H514 L520 550 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <g fill="#4E9A54">
    <use href="#leaf" transform="translate(500 522) rotate(-28) scale(0.45)"/>
    <use href="#leaf" transform="translate(500 522) rotate(20) scale(0.5)"/>
  </g>

  <!-- mesa comprida 2 (primeiro plano) -->
  <ellipse cx="800" cy="880" rx="700" ry="16" fill="#001C55" opacity="0.12"/>
  <use href="#chair" x="260" y="650"/>
  <use href="#chair" x="500" y="650"/>
  <use href="#chair" x="760" y="650"/>
  <use href="#chair" x="1020" y="650"/>
  <use href="#chair" x="1260" y="650"/>
  <use href="#lap" x="500" y="660"/>
  <use href="#lap" x="1010" y="660"/>
  <rect x="180" y="734" width="1240" height="26" rx="6" fill="#D9B48F"/>
  <rect x="196" y="760" width="1208" height="12" fill="#B98A62"/>
  <g fill="#475569">
    <rect x="230" y="772" width="16" height="128"/>
    <rect x="1354" y="772" width="16" height="128"/>
  </g>
  <rect x="300" y="714" width="70" height="20" rx="3" fill="#F28C6B"/>
  <rect x="800" y="706" width="26" height="28" rx="4" fill="#F8FAFC" stroke="#0E6BA8" stroke-width="3"/>
  <rect x="1240" y="716" width="80" height="18" rx="3" fill="#A6E1FA"/>

  <!-- planta grande à direita -->
  <path d="M1460 900 L1472 790 H1548 L1560 900 Z" fill="#F28C6B"/>
  <g fill="#3F8448">
    <use href="#leaf" transform="translate(1510 790) rotate(-30) scale(2)"/>
    <use href="#leaf" transform="translate(1510 790) rotate(10) scale(2.3)"/>
  </g>
  <g fill="#5DAE5F">
    <use href="#leaf" transform="translate(1510 790) rotate(40) scale(1.8)"/>
    <use href="#leaf" transform="translate(1510 790) rotate(-62) scale(1.4)"/>
  </g>
</svg>
