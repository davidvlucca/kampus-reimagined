# Corre em cada push e pull request: lint, tipos, testes (Vitest), o build da Vercel com o
# orçamento do bundle e testes de ponta a ponta (Playwright + axe) numa cópia da app com
# PGlite. Não precisa de segredos. Node 22, o mesmo da função na Vercel (nodejs22.x).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, build, bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # O mesmo build que a Vercel corre (client, bundle da API e rotas). O server não tem
      # outro passo de build: o typecheck acima já é o "npm run build -w server".
      - run: npm run build:vercel
      - run: node scripts/check-bundle.ts

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
